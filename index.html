<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 400px;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 70%, #D2B48C 70%, #D2B48C 100%);
            border: 2px solid #333;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background-color: white;
            border-radius: 50px;
            top: 50px;
            opacity: 0.8;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background-color: white;
            border-radius: 50%;
        }

        .cloud::before {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 10px;
        }

        .cloud::after {
            width: 30px;
            height: 30px;
            top: -15px;
            right: 10px;
        }

        #dinosaur {
            position: absolute;
            bottom: 80px;
            left: 50px;
            width: 50px;
            height: 50px;
            background-color: #8B4513;
            border-radius: 5px;
        }

        .dino-head {
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: #8B4513;
            border-radius: 3px;
            right: -20px;
            top: 5px;
        }

        .dino-eye {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: black;
            border-radius: 50%;
            right: 5px;
            top: 8px;
        }

        .dino-stripe {
            position: absolute;
            background-color: black;
            height: 3px;
        }

        .stripe1 { width: 15px; top: 10px; left: 20px; }
        .stripe2 { width: 15px; top: 18px; left: 15px; }
        .stripe3 { width: 15px; top: 26px; left: 20px; }

        .dino-leg {
            position: absolute;
            background-color: #8B4513;
            bottom: -15px;
        }

        .leg1 { width: 8px; height: 20px; left: 10px; }
        .leg2 { width: 8px; height: 20px; right: 10px; }

        .dino-tail {
            position: absolute;
            width: 30px;
            height: 8px;
            background-color: #8B4513;
            left: -25px;
            top: 15px;
            border-radius: 4px;
        }

        #dinosaur.jump {
            animation: jump 0.6s ease-out;
        }

        @keyframes jump {
            0% {
                bottom: 80px;
            }
            50% {
                bottom: 150px;
            }
            100% {
                bottom: 80px;
            }
        }

        .obstacle {
            position: absolute;
            bottom: 80px;
            width: 30px;
            height: 50px;
        }

        .tree {
            background-color: #228B22;
            border-radius: 5px;
            width: 30px;
            height: 45px;
            position: relative;
        }

        .tree-stem {
            position: absolute;
            bottom: -8px;
            left: 10px;
            width: 10px;
            height: 10px;
            background-color: #8B7355;
            border-radius: 2px;
        }

        .tree::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 20px solid #228B22;
            top: -15px;
            left: 0;
        }

        #score {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
            display: none;
        }

        #gameOver h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        #gameOver p {
            font-size: 20px;
            margin-bottom: 10px;
        }

        #gameOver button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 18px;
            background-color: #228B22;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #gameOver button:hover {
            background-color: #1a6b1a;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="score">Score: 0</div>
        <div id="dinosaur">
            <div class="dino-tail"></div>
            <div class="dino-head">
                <div class="dino-eye"></div>
            </div>
            <div class="dino-stripe stripe1"></div>
            <div class="dino-stripe stripe2"></div>
            <div class="dino-stripe stripe3"></div>
            <div class="dino-leg leg1"></div>
            <div class="dino-leg leg2"></div>
        </div>
        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p id="finalScore">Score: 0</p>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
